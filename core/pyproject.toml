[project]
name = "asistente-core"
version = "0.1.0"
description = "Núcleo del asistente personal: LLM local, herramientas, voz, visión y memoria."
readme = "README.md"
license = "MIT"
authors = [{ name = "Araldi Garcia" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # S1 · Cerebro y chat
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ollama>=0.4",
    "pydantic-settings>=2.4",
    # S2 · Control del sistema
    "psutil>=6.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    # S2+ · Internet y memoria
    "ddgs>=9",
    "trafilatura>=2",
    "httpx>=0.27",
    "numpy>=1.26",
    "cryptography>=43",
]

[project.optional-dependencies]
# S3 · Voz
voz = [
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "openwakeword>=0.6",
    "piper-tts>=1.2",
    "sounddevice>=0.5",
    "numpy>=1.26",
]
# S5 · Cámara y visión
vision = [
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
]
# S6 · Memoria
memoria = [
    "sqlite-vec>=0.1.6",
]
# S7 · Integraciones
integraciones = [
    "mcp>=1.2",
    "playwright>=1.47",
]
todo = ["asistente-core[voz,vision,memoria,integraciones]"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
asistente-core = "asistente_core.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
